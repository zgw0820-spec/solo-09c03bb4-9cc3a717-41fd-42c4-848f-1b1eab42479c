services:
  restore-api:
    build: .
    image: archive-restore-api:latest
    container_name: archive-restore-api
    # Run as the host user so restored files land in the bind mount with the
    # right ownership (the image's default UID cannot write to ./restored).
    user: "${RESTORE_UID:-1000}:${RESTORE_GID:-1000}"
    ports:
      - "8000:8000"
    environment:
      RESTORE_ARCHIVE_DIR: /backups
      RESTORE_OUTPUT_DIR: /restored
      RESTORE_MAX_CONCURRENT: "2"
      # Recycle bin. Capacity is metered in 512-byte blocks actually used by
      # regular files (hard links inside one tree count once): 262144 blocks
      # = 128 MiB. Retention is 10 minutes for the demo so an expiry/cleanup
      # can be observed in Swagger without waiting; raise it for real shifts.
      RECYCLE_CAPACITY_BLOCKS: "262144"
      RECYCLE_RETENTION_SECONDS: "600"
    volumes:
      # Backups are mounted read-only: the service never writes to them.
      - ./backups:/backups:ro
      - ./restored:/restored
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else sys.exit(1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
